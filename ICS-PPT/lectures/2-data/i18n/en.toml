['binary-rounding.slide.2']
src_hash = '5fcffc9a'
text = '''

- When the bits after the rounding position are `100…0`, the value is a <mark>midpoint</mark> and goes to the side whose last bit is 0; above the midpoint it rounds up, below it rounds down
- Rounding row 3 up produces a carry, and the integer part changes from `10` to `11`
'''

['binary-rounding.notes.1']
src_hash = '182d1881'
text = '''

Row 1 drops `011`, below the midpoint `100`; row 2 drops `110`, above the midpoint.
Rows 3 and 4 both drop exactly `100`: `10.11` ends in 1 and goes up to `11.00`; `10.10` already ends in 0 and stays.
Floating-point fractions are rounded by the same rule, and the FP32-to-BF16 conversion later uses exactly this rule.
'''

['patriot-missile.title']
src_hash = 'caaa3d66'
text = 'The Patriot missile: rounding error in 0.1 accumulates over time'

['patriot-missile.demo.1.name']
src_hash = 'ff840035'
text = 'Computing the clock error after 100 hours'

['patriot-missile.slide.1']
src_hash = '8d30167b'
text = '''

- On 25 February 1991, a Patriot battery failed to intercept a Scud missile; 28 people died
- The clock ticked every 0.1 s; the program approximated 0.1 with a 24-bit binary fraction
- Each tick lost about $10^{-7}$ s; after 100 hours of operation the error was 0.343 s
'''

['patriot-missile.slide.1.footnote.1']
src_hash = 'b8f44ff9'
text = 'A Patriot missile launch. Photo from Wikimedia Commons, taken by the U.S. Army, public domain.'

['patriot-missile.notes.1']
src_hash = '099444d1'
text = '''

$0.1 = 0.0\overline{0011}_2$; truncating after 23 bits gives $x = 0.00011001100110011001100_2$,
and $0.1 - x = 0.00000000000000000000000[1100]\ldots_2 \approx 2^{-20} \times 0.1$.
100 hours is $100 \times 3600 \times 10 = 3.6 \times 10^6$ ticks; times the per-tick error this gives 0.343 s.
A Scud travels at about 2000 m/s and covers about 687 m in 0.343 s, which put it outside the radar's tracking window.
Part of the software had already been changed to compute time precisely while another part still used the old approximation, so the errors did not cancel when the two were subtracted.
'''

['float-not-real.title']
src_hash = 'd3103535'
text = 'A finite representation does not obey the laws of real arithmetic'

['float-not-real.demo.1.name']
src_hash = '481bbba1'
text = 'Three examples'

['float-not-real.slide.1']
src_hash = '2a8f6c28'
text = '''
- Floating-point addition <mark>is not associative</mark>: the order of the additions changes the result
- A finite decimal fraction may repeat in binary, and `0.1` and `0.2` are both rounded
'''

['float-not-real.highlight.1']
src_hash = 'd7d0fc75'
text = '`float` is a finite-width approximation, and its operations do not obey the laws of real arithmetic.'

['float-casts.title']
src_hash = 'f000c308'
text = 'Conversions between integers and floating point in C'

['float-casts.demo.1.name']
src_hash = '0872ce94'
text = 'x = 2^24 + 1, f = 0.1f, d = 0.1'

['float-casts.slide.1']
src_hash = '3c2ffffc'
text = '''

- `int` to `double` is exact; `int` to `float` must round values above $2^{24}$
- Floating point to integer <mark>truncates toward zero</mark>; out of `int` range the C standard leaves the result undefined, and x86-64 gives $-2^{31}$
- `2/3` is integer division and yields 0; `2/3.0` is floating-point division
'''

['float-casts.notes.1']
src_hash = 'ef845cf9'
text = '''

`float` to `double` loses nothing, and converting back to `float` returns the original value; `double` to `float` drops the last 29 fraction bits, so the approximation of 0.1 changes.
On x86-64 an out-of-range conversion is done by the `cvttsd2si` instruction, which always returns `0x80000000`, the integer indefinite value; other platforms may saturate to the largest or smallest value.
Quantization must round explicitly when converting floats to integers: `(int)` truncates toward zero, so errors on both sides lean toward 0;
this lecture's `quant_compare.c` uses `lrintf`, which rounds in the current mode (round to nearest even by default).
'''

['precision-formats.title']
src_hash = '5b35a562'
text = 'Low-precision floating-point formats'

['precision-formats.slide.1']
src_hash = '49b7eaaa'
text = '''
The formats differ only in how the fields split the bits.
- **BF16**: FP32's 8-bit exponent and range, 16 fewer fraction bits
- **FP16**: 5-bit exponent, maximum 65504, large values overflow
- **FP8**: E4M3 favours precision, E5M2 range
'''

['precision-formats.slide.2']
src_hash = '731c750a'
text = 'Dropping low fraction bits cuts storage and memory traffic in proportion and speeds multiply-add, if output quality tolerates it.'

['precision-formats.notes.1']
src_hash = '038b660c'
text = '''

FP64 divides its bits 1 · 11 · 52 and is used in scientific computing; it rarely appears in deep learning and is not shown. The three gains can be stated separately: the weight file and the memory it occupies shrink in proportion to the bit width; the memory traffic per token shrinks in the same proportion; and low-precision multiply-add units on accelerators have higher throughput than high-precision ones.
'''

['bf16-truncation.title']
src_hash = '6157818b'
text = 'Converting FP32 to BF16: keep the top 16 bits, then round'

['bf16-truncation.demo.1.name']
src_hash = '7932a759'
text = 'Converting three values'

['bf16-truncation.slide.1']
src_hash = '54e7a581'
text = '''

- The conversion keeps the sign bit, the exponent and the first 7 fraction bits, then rounds on the 16 dropped bits
- Adding one to an all-ones fraction <mark>carries into the exponent</mark>: 1.99999988 converts with the exponent going from 127 to 128, value 2
'''

['bf16-truncation.notes.1']
src_hash = 'c7607d82'
text = '''

In row 1 the highest dropped bit is 0, so rounding and truncation agree; in row 2 the dropped part exceeds one half and the fraction gains one;
in row 3 the fraction was all ones, and adding one clears it and increments the exponent. All three rows match the compiler's conversion to `__bf16`.
The test is the rule from the binary rounding page: `rest` above `0x8000` is more than half, equal to `0x8000` is a midpoint, and the midpoint goes to the even side.
Carrying from `0x7f7f` gives `0x7f80`, infinity, which agrees with how round-to-nearest overflows; this code does not handle NaN.
`examples/bf16.c` only truncates and prints the part of π that is dropped, for comparison.
BF16's role in training: it has the same range as FP32, so extra measures such as loss scaling are unnecessary;
the cost is a relative precision of about three decimal digits.
'''

['bf16-classes.title']
src_hash = 'da25a32a'
text = 'Normalized and denormalized values in BF16'

['bf16-classes.demo.1.name']
src_hash = 'adf4251b'
text = 'Interpret several bit patterns as BF16'

['bf16-classes.slide.1']
src_hash = '2e0d2ef7'
text = '''

- 1 sign bit, 8 exponent bits, 7 fraction bits, bias 127; a normalized value is $(-1)^s \times 1.f \times 2^{e-127}$
- An all-zero exponent gives a <mark>denormalized value</mark> $(-1)^s \times 0.f \times 2^{-126}$, which joins the normalized range without a gap
- An all-ones exponent is a special value: a zero fraction means infinity, a nonzero fraction means NaN
'''

['bf16-classes.notes.1']
src_hash = '932d4497'
text = '''

BF16 follows exactly the same rules as FP32; only the fraction shrinks from 23 bits to 7, while the 8 exponent bits stay the same.
With an all-zero exponent, $E$ is $1-127=-126$ rather than $-127$: the largest denormalized value `0x007f` is $127 \times 2^{-133}$,
and the smallest normalized value `0x0080` is $128 \times 2^{-133} = 2^{-126}$, one step $2^{-133}$ apart.
`0x0080` equals the smallest normalized FP32 value, and `0x7f7f` is of the same order as the FP32 maximum; both follow from the shared exponent.
The program copies each bit pattern into a GCC `__bf16` variable and prints it as a float, so the compiler does the decoding.
'''

['range-and-precision.title']
src_hash = 'ee384c82'
text = 'Range and precision are independent'

['range-and-precision.demo.1.name']
src_hash = 'f74a52aa'
text = 'One value in three formats'

['range-and-precision.slide.1']
src_hash = 'b97b203a'
text = '''
- 100000 exceeds FP16 and gives `inf`; BF16's wider exponent holds it
- $1/3$ is closer in FP16, which has 3 more fraction bits
- Training gradients span a wide range and favour BF16; inference fits FP16
'''

['range-and-precision.highlight.1']
src_hash = 'dd379ce6'
text = 'Exponent bits set range; fraction bits set precision.'

['range-and-precision.notes.1']
src_hash = '40d7cd12'
text = '''

With the total width fixed, how many bits go to the exponent and how many to the fraction is a design trade-off: FP16 and BF16 are both 16 bits, and BF16 moves 3 bits from the fraction to the exponent, giving it FP32's range and lower precision. The 100000 line and the $1/3$ line above are the two ends of that trade.
'''

