src_hash = 'ee7caa8c'
text = ''
# src:
# 
# - **浮点加法的微架构对齐过程**：
#   - 浮点加法执行前必须先进行阶码对齐：较小阶码的操作数尾数需向右移位。
#   - 移位超出尾数寄存器物理位宽的部分将被移出并舍弃。
# - **浮点吸收现象**：
#   - 当两个操作数阶码差值 $\Delta E \ge 24$ 时，较小操作数的有效位在右移对齐后彻底丢失。
#   - 数学表现：存在非零正数 $y > 0$，使得硬件计算结果满足 $x \oplus y = x$。

