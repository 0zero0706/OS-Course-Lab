# src:
# 
# - **硬件级无偏舍入实现算法**：
#   - 硬件通过简单的偏置加法，即可实现向最近偶数舍入。
#   - 尾数全 1 进位时，加法器能自动自然溢出至阶码字段，无需额外的边界修正指令。
# - **特殊值完全兼容**：
#   - 由于阶码位宽与偏置量完全一致，无穷大、非数（NaN）以及非规格化数的边界判定与 FP32 严格兼容，软硬件边界条件完全对齐。

