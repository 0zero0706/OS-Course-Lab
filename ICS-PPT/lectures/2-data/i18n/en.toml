['affine-mapping.title']
src_hash = '8ef7b0ec'
text = ''
# src: 形式化：均匀仿射量化映射

['affine-mapping.slide.1']
src_hash = 'a98b9710'
text = ''
# src:
# 
# - **映射任务**：将连续浮点区间 $[w_{\min}, w_{\max}]$ 投射至 $b$-bit 整数集合 $[q_{\min}, q_{\max}]$。
# - **量化编码公式**：
#  $$q = \text{clip}\left(\left\lfloor \frac{w}{S} \right\rceil + Z, \; q_{\min}, \; q_{\max}\right)$$
# - **反量化重构公式**：
#  $$\hat{w} = S \times (q - Z) \quad \text{或写为} \quad \hat{w} = d \cdot q + m$$
# - **参数的物理意义**：
#   - **步长 $S$（或 $d$）**：正浮点数，表示离散网格的单位刻度间距：$S = \frac{w_{\max} - w_{\min}}{q_{\max} - q_{\min}}$。
#   - **零点 $Z$（或偏移 $m$）**：与 $q$ 同类型的整数，确保 $0.0$ 能精准落在某个整数格子上。
# - **误差界**：单点舍入误差受限于半个步长：$|w - \hat{w}| \le \frac{S}{2}$。

['affine-mapping.slide.1.footnote.1']
src_hash = '889f6ef5'
text = ''
# src: 文献出处：Jacob, B. et al. CVPR (2018).

['affine-mapping.notes.1']
src_hash = '608c5369'
text = ''
# src:
# 
# 这两个公式是所有量化算法的母体。$S$ 决定尺子的刻度有多细，它本身是一个浮点数；$Z$ 是把
# 原点固定在哪个整数格上。只要没有超出量化范围，四舍五入带来的误差绝对不超过半个刻度。
# 量化的全部技巧，就是在想方设法把这个刻度 $S$ 变得更小。

['affine-grid.title']
src_hash = '8a2ec8a6'
text = ''
# src: 图解：$w$、$q$、$S$、$Z$ 在数轴上的含义

['zero-point-cost.title']
src_hash = '27b378bc'
text = ''
# src: 零点 $Z$ 引发的交叉项惩罚

['zero-point-cost.slide.1']
src_hash = '0f42afd6'
text = ''
# src:
# 
# - **由反量化公式**：$\hat{w} = S\,(q - Z)$。对称量化令 $Z = 0$，公式退化为 $\hat{w} = S\,q$。
# - **矩阵乘法 $Y = XW$ 的每个输出元素是一个点积**：$X$ 的一行与 $W$ 的一列逐项相乘再求和，$y = \sum_{k=1}^{K} x_k w_k$，其中 $K$ 是向量长度。
# - **激活与权重各自量化**，各有一组步长与零点：
#   - 激活：$x_k \approx S_x\,(a_k - Z_x)$，整数码 $a_k$ 随每次输入变化。
#   - 权重：$w_k \approx S_w\,(b_k - Z_w)$，整数码 $b_k$ 在模型离线量化之后固定不变。
# - **代入点积，按乘法分配律展开**：
#  $$y \approx S_x S_w \sum_{k=1}^{K} (a_k - Z_x)(b_k - Z_w) = S_x S_w \Big[\, \underbrace{\sum a_k b_k}_{\text{①}} - \underbrace{Z_w \sum a_k}_{\text{②}} - \underbrace{Z_x \sum b_k}_{\text{③}} + \underbrace{K Z_x Z_w}_{\text{④}} \,\Big]$$
# - ② 与 ③ 由一侧的零点乘以另一侧整数码之和得到，称为**交叉项**。

['zero-point-cost.notes.1']
src_hash = 'e5a8b6cf'
text = ''
# src:
# 
# 第 55 页的反量化公式同时用于激活和权重。矩阵乘法的每个输出元素都是一个点积，把两个反量化
# 公式代入点积，再用乘法分配律展开，得到四项：① 是整数码的点积；② 和 ③ 各含一个零点，
# 是交叉项；④ 是常数。对称量化时两个零点都是 0，后三项全部消失。

['zero-point-compute.title']
src_hash = '1118643f'
text = ''
# src: 零点 $Z$ 带来的额外计算量

['zero-point-compute.slide.1']
src_hash = 'c0c414d0'
text = ''
# src:
# 
# - **展开式中各项的计算时机**：
#   - ① $\sum a_k b_k$：$K$ 次 8 位整数乘加，对称量化同样需要。
#   - ② $Z_w \sum a_k$：$a_k$ 随输入变化，推理时现算 $\sum a_k$，多 $K$ 次加法。
#   - ③ $Z_x \sum b_k$ 与 ④ $K Z_x Z_w$：只含权重与常数，使用同一个量化模型进行推理时，可以离线计算存储复用。

