['float-distribution.notes.1']
src_hash = '4d76ea39'
text = '''
The figure uses a simplified format with only 3 fraction bits; FP32 divides each interval into $2^{23}$ parts on the same principle.
Each interval in the table has length $2^E$; dividing by $2^{23}$ gives the step $2^{E-23}$, and dividing the step by the interval start $2^E$ always gives $2^{-23}$.
Absolute precision falls as values grow: above $2^{24}$ neighbouring FP32 values differ by 2, so odd integers are no longer representable;
near $10^9$ the step is 64, so a counter kept in a float stops changing when 1 is added once it reaches a billion.
The denormalized values near zero are the one evenly spaced stretch, filling the gap between the smallest normalized value and zero.
'''

['float-rounding.title']
src_hash = '225a5686'
text = 'Rounding: taking the nearest representable value'

['float-rounding.demo.1.name']
src_hash = '68e6b4e8'
text = 'Three integers and one fraction'

['float-rounding.slide.1']
src_hash = '6fef9ceb'
text = '''

- Above $2^{24}$ adjacent FP32 values differ by 2, so an odd number falls exactly midway between two representable values
- At the midpoint the value whose last fraction bit is even is chosen, which is called <mark>round to nearest even</mark>, so that error does not accumulate in one direction
- `0.1` is a repeating fraction in binary, and a finite format can only store an approximation
'''

['float-rounding.notes.1']
src_hash = '6259ac85'
text = '''

Round to nearest even is the IEEE 754 default; the next page lists all four modes.
Both rules guarantee that a single rounding errs by no more than half a step, which is the basis of the quantization error bound;
the section on quantization shows how that bound fails once the two ends of the coding interval are asymmetric.
'''

['rounding-modes.title']
src_hash = 'aeec42f4'
text = 'The four IEEE 754 rounding modes'

['rounding-modes.demo.1.name']
src_hash = '5b89f925'
text = 'Rounding five values to integers in four modes'

['rounding-modes.slide.1']
src_hash = '9dbcd780'
text = '''

- **Downward** takes the nearest value not above the true value, **upward** the nearest not below it, **toward zero** drops the fractional part
- **Round to nearest even** is the default; it differs from round-half-up only at midpoints, where both 1.50 and 2.50 give 2
- The other three modes always err toward the same side, so a sum over many values comes out systematically too large or too small
'''

['rounding-modes.notes.1']
src_hash = 'ae5c5a98'
text = '''

The program switches modes with `fesetround`, and `nearbyint` rounds in the current mode.
Round to nearest even goes up at half of the midpoints and down at the other half, so the expected error of a sum is zero.
A decimal example, rounding to two places: 1.2349999 gives 1.23, 1.2350001 gives 1.24,
1.2350000 gives 1.24 (midpoint, up), and 1.2450000 gives 1.24 (midpoint, down).
'''

