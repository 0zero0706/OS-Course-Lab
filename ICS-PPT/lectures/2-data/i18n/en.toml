text = ''
# src:
# 
# - Llama-3.2 输出层 LayerNorm 共 2048 参数，**取值全部为正**，分布在 $[+0.0417, +2.9219]$。
# - **对称量化（Q4_0）的局限**：
#   - 步长由最大绝对值强制对称决定：$d_{\text{sym}} = \frac{2.9219}{8} \approx \mathbf{0.365}$。
#   - 16 个网格强制排布在 $[-2.92, +2.92]$，**其中 8 个落在负数区间，未被有效利用**。
# - **非对称量化（Q4_1）的修正**：
#   - 记录独立最小值 $m = 0.0417$，步长按极差紧密划分：$d_{\text{asym}} = \frac{2.9219 - 0.0417}{15} \approx \mathbf{0.192}$。
#   - **步长精细了 1.9 倍，16 个量化级被量化后的权重 100% 覆盖**。

['symmetric-failure.notes.1']
src_hash = '0f2d1c99'
text = ''
# src:
# 
# 刚才我们说对称量化硬件友好，但大家看屏幕上我们跑出来的真实数据！LayerNorm 的权重全是
# 正数，集中在 1 到 3 之间。对称量化非要把原点设在 0，结果一半的格子全分给了根本不存在的
# 负数。这就是为什么大模型里普通的线性层用对称，而归一化层必须保留非对称甚至保留原始浮点。

