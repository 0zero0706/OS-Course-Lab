# src:
# 
# - **根源剖析**：
#   - **BERT（整段序列一次前向）**：算术强度高达 **117 ~ 266 FLOP/Byte**
#     $\implies$ 处于**算力受限区**，硬件计算单元 满负荷运转。
#   - **GPT-2（自回归逐 token 生成）**：算术强度跌落至仅 **2 FLOP/Byte**
#     $\implies$ 处于**访存受限区**，计算单元长期处于等待数据的饥饿状态。
# - **量化的本质**：不改变计算图，直接将数据体积削减至 $1/4$（BF16 → 4 位），迫使工作点在 Roofline 模型上大幅向右跃迁。

