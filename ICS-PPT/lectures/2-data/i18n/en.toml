# src: 浮点重构：从通用规范到专用 AI 浮点

['ai-float-formats.slide.1']
# CHANGED: was ff6632fe
src_hash = 'a7537c88'
text = ''
# src:
# 
# - **位域演变对比**：
#   - **FP32**：`[1s]` + `[8 exp]` + `[23 mantissa]`
#   - **FP16**：`[1s]` + `[5 exp]` + `[10 mantissa]` （动态范围过小，极易溢出）
#   - **BF16**：`[1s]` + `[8 exp]` + `[ 7 mantissa]` （保全 8 位阶码，动态范围与 FP32 相同）
# - **NVIDIA Hopper 时代的 1 字节浮点：FP8 双子星规范**：
#   1. **E4M3（1 位符号，4 位阶码，3 位尾数）**：
#      - 相对偏向精度，**专为前向推理的权重与激活值定制**。
#      - **突破 IEEE 规范**：废除无穷大（$\pm\infty$）编码，将保留码段释放用来表示更大正常数（最大数达 448）。
#   2. **E5M2（1 位符号，5 位阶码，2 位尾数）**：
#      - 阶码与 FP16 一致，动态范围广，**专为反向传播的梯度更新定制**。

['ai-float-formats.slide.1.footnote.1']
src_hash = '0017a887'
text = ''
# src: 文献出处：Micikevicius, P. et al. *FP8 Formats for Deep Learning*, arXiv:2209.05433 (2022).

['ai-float-formats.notes.1']
src_hash = '05a68de5'
text = ''
# src:
# 
# 体系结构的发展展现了对传统规范的务实重塑。BF16 为了确保数值不发生下溢，大幅缩减尾数以保留
# 完整的 8 位阶码；而到了 FP8 时代，E4M3 甚至废除了对无穷大的编码保留，将其重新分配给有限
# 数值以扩展表示范围。这表明在特定领域计算中，数据表示形式始终服务于具体的系统效能与动态范围
# 需求。

['nf4-lut.title']
src_hash = 'f92db3e9'
text = ''
# src: 非均匀量化：NF4 的信息论等熵分割

['nf4-lut.slide.1']
# CHANGED: was ea3f9508
src_hash = 'cb58e0c4'
text = ''
# src:
# 
# - **均匀整数量化的理论缺陷**：
#   - 预训练模型的权重呈现极其平滑的**标准正态分布 $\mathcal{N}(0, 1)$**。
#   - 等距网格导致：两端稀疏区浪费编码，中间高频区精度严重不足。
# - **香农信息论原则**：
#   - 最优量化要求每个离散符号出现的后验概率均等（**最大化信息熵**）。
# - **NF4 量化实现机制**：
#   - 基于标准正态分布累积分布函数，将概率质量精确切分为面积相等的 16 个等熵子区间。
#   - **硬件查找表架构**：
#     - 4 位存储的不再是数值，而是 **0 ~ 15 的查找表索引**；
#     - 运行时通过一张仅含 16 个 FP16 常量的极小片上查找表，瞬间还原为浮点送入计算。

['nf4-lut.slide.1.footnote.1']
src_hash = 'aaf611aa'
text = ''
# src: 文献出处：Dettmers, T. et al. *QLoRA: Efficient Finetuning of Quantized LLMs*, NeurIPS (2023).

['nf4-lut.notes.1']
src_hash = 'd4153ccc'
text = ''
# src:
# 
# NF4 是算法、信息论与系统工程交织的代表作。它不指望硬件加法器去支持非等距运算，而是巧妙地
# 在芯片 SRAM 缓存里放一张 16 点的黄金正态分布表。内存里存 4 位的索引，算的时候查一下表。
# 看似简单的查找表，背后是严丝合缝的信息论最大熵原理。

