['c-data-sizes.notes.1']
src_hash = 'c56f3b67'
text = '''

When a fixed width is required, use int32_t / uint64_t from `<stdint.h>`; those are the same width everywhere. What is worth stressing in class is that long and pointers vary with the platform: code that stores a pointer in an int loses the high half on a 64-bit platform. 64-bit Linux and macOS are LP64, where `long` is 8 bytes; Windows is LLP64, where `long` is 4 bytes and a pointer is still 8, so the `long` row of the 64-bit column reads 4 there. Programs in WSL2 are Linux programs and match the table.
'''
# src:
# 
# 需要固定宽度时使用 `<stdint.h>` 中的 int32_t / uint64_t，它们在各平台上宽度一致。
# 课堂上值得强调的是 long 与指针随平台变化：把指针存进 int 的代码在 64 位平台上会丢掉高位。
# 64 位的 Linux 与 macOS 采用 LP64，`long` 为 8 字节；原生 Windows 采用 LLP64，
# `long` 为 4 字节而指针为 8 字节，此时表中「64 位」一列的 `long` 应读作 4。
# WSL2 中的程序是 Linux 程序，与表中的 64 位一列一致。

['bool-storage.title']
src_hash = '732470c1'
text = 'Aside: the space a boolean occupies'
# src: 拓展：布尔值占用的空间

['bool-storage.slide.1']
src_hash = '6bf4dc51'
text = '''

C has no built-in boolean type; zero and non-zero integers carry falsity and truth. C99 introduced `_Bool`, and `<stdbool.h>` defines `bool` as an alias for it. In C++ `bool` is built in.
- In both languages `sizeof(bool)` is <mark>one byte</mark>: the byte is the smallest addressable unit
- A boolean needs only 1 bit of information; the other 7 take no part in its value
- On assignment any non-zero value converts to 1, so `bool b = 17;` leaves the byte `0x01`
'''
# src:
# 
# **C 语言没有内置的布尔类型，真假由整数的零与非零表示；C99 引入 `_Bool`，**
# **`<stdbool.h>` 把 `bool` 定义为它的别名。C++ 中 `bool` 是一个内置类型。**
# - 两种语言中 `sizeof(bool)` 都是 <mark>1 个字节</mark>：字节是最小的可寻址单位
# - 一个布尔值只需要 1 位信息，其余 7 位不参与取值
# - 赋值时任何非零值都被转换为 1，`bool b = 17;` 在内存中留下的字节是 `0x01`

