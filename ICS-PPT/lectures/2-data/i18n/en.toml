src_hash = '5b436f82'
text = '1450 token/s'

['why-quantize.slide.2']
src_hash = '9961005d'
text = '''
- 89.6 GB/s is the peak bandwidth of dual-channel DDR5-5600; 1008 GB/s is the peak video-memory bandwidth of an RTX 4090
- With a single request, each weight takes part in only one multiply-add, so the arithmetic intensity is very low (about 1 operation per byte read)
'''

['why-quantize.highlight.1']
src_hash = '7e03cd7f'
text = 'Single-request inference is bounded by memory bandwidth; the bit width of the weights sets generation speed almost linearly.'

['why-quantize.notes.1']
src_hash = '43c1ff53'
text = '''

The numbers in the table are bandwidth divided by size — ceilings rather than measurements: a real system also reads and writes the KV cache, launches operators, and never reaches peak bandwidth utilization. The parameter count 1 235 814 400 is taken from the safetensors header of Llama-3.2-1B-Instruct, the model used in the experiments later in this lecture. Dual-channel DDR5-5600: 5600 MT/s × 8 bytes × 2 = 89.6 GB/s. Batched inference is a different regime: when one forward pass serves many requests the same weights are used repeatedly, the bottleneck shifts from memory to compute, and the benefit of quantization falls accordingly.
'''

['memory-bound-measured.title']
src_hash = '26df3615'
text = 'The memory bottleneck, measured'

['memory-bound-measured.image.1.footnote.1']
src_hash = '9f236d01'
text = 'From Gholami et al., AI and Memory Wall (IEEE Micro 2024), Figure 3(b)(d), CC BY 4.0; subplot titles removed and the two joined side by side.'

['memory-bound-measured.slide.1']
src_hash = '3153580e'
text = '''
- Left: memory operations of one forward pass; right: the corresponding end-to-end latency (measured with a single request)
- As the sequence length grows from 128 to 4096, the memory operations of the autoregressive GPT-2 grow 45.7×, and its latency grows 52.1×
'''

['memory-bound-measured.notes.1']
src_hash = 'db0c04f3'
text = '''

The original figure has four panels; this page takes two: 3(b) is the memory traffic of one forward pass (GMOPs) and 3(d) is the end-to-end latency of the same pass, normalized to 1 for BERT-Base at sequence length 128, both at batch size 1. At sequence length 4096, BERT-Base does 1324 GFLOPs and GPT-2 1012 GFLOPs. The omitted panel 3(c) gives arithmetic intensity: GPT-2 is 2 FLOP/byte at every sequence length, BERT between 117 and 266. Arithmetic intensity is the number of floating-point operations performed per byte read, and it decides whether a computation is limited by bandwidth or by arithmetic. The paper's conclusion is that decoder models at small batch sizes are bound by memory rather than compute.
'''

['memory-bound-measured-cont.title']
src_hash = '26df3615'
text = 'The memory bottleneck, measured'

['memory-bound-measured-cont.slide.1']
src_hash = '5dc32e6b'
text = "- At sequence length 4096, BERT-Base and GPT-2 compute similar amounts, yet GPT-2's relative latency reaches 2344 while BERT-Base's is only 84 (about 28× apart)"

['memory-bound-measured-cont.highlight.1']
src_hash = 'd24ac884'
text = 'In autoregressive decoder models, end-to-end latency is limited mainly by memory operations, not by computation.'

['quantization-idea.title']
src_hash = '9332ce10'
text = 'The principle of uniform quantization'

['quantization-idea.slide.1']
src_hash = '9ed764e2'
text = '**Uniform quantization divides the range of the floating-point weights into equally spaced discrete steps (quantization levels), and maps each weight to <mark>the nearest integer code</mark>.**'

['quantization-idea.notes.1']
src_hash = 'bfa2215c'
text = '''

"Away from the saturating end" is a necessary qualification. Q4_0's 16 codes represent −8 to 7, which is asymmetric: the scale is taken as $d = \max / (-8)$, so the extreme value of the group lands exactly on code 0; a weight of the opposite sign and comparable magnitude computes a code above 15, is clamped to 15, and reconstructs as $7d$ rather than $8d$, an error of up to a full step. This is the same fact as $|TMin| = TMax + 1$ from the section on integers.
'''

['quantization-idea-cont.title']
src_hash = '9332ce10'
text = 'The principle of uniform quantization'

['quantization-idea-cont.slide.1']
src_hash = 'f6379a8f'
text = '''
- A 4-bit unsigned code represents 16 levels; a group of weights shares one floating-point scale (the step) $d$
- Dequantization approximates the value as $\hat{w} = (q - 8) \cdot d$, with code $q \in [0, 15]$
- Within the range where no saturation occurs, the rounding error of each value is at most half a step ($\le d/2$), and the step is proportional to the range of the weights
'''

['quantization-idea-cont.highlight.1']
src_hash = '87710464'
text = 'Uniform quantization approximates real numbers with discrete grid points, trading a bounded rounding error for a large saving in storage.'

['quantization-map.title']
src_hash = '6655f01a'
text = 'The affine mapping model'

['quantization-map.slide.1']
src_hash = '5f46a20c'
text = 'A group of floating-point weights maps to unsigned integer codes through two parameters: the step $d$ and the offset $m$. Dequantization is $\hat{w} = d \cdot q + m$.'

['quantization-map.slide.2']
src_hash = '1e9f9920'
text = '''
- **Granularity**: the number of weights that share one pair $(d, m)$ (the group size)
- **Bit width**: the number of bits in a code (4 bits give 16 levels)
- **Zero point**: an offset tied to the step (for example $m = -8d$, symmetric about 0) is <mark>symmetric quantization</mark>; an offset stored separately from the data (for example the block minimum) is <mark>asymmetric (affine) quantization</mark>
'''

['quantization-map.slide.3']
src_hash = 'eb604f53'
text = 'Once these three are fixed, quantization is a scale, a shift and a rounding with clamping, and dequantization is a simple linear computation.'

['quantization-map.aside.1']
src_hash = 'f4b90df6'
text = 'Symmetric quantization needs no separate formula: with $m$ fixed at $-8d$, codes 0 to 15 correspond to $-8$ to $+7$ steps. The two differ only in whether $m$ is stored and adjusted independently.'

['quantization-map.highlight.1']
src_hash = 'f7fe0402'
text = 'Designing a quantization format is a trade-off among granularity, bit width and zero point.'

['quantization-map.notes.1']
src_hash = 'b2c66890'
text = '''

Q4_0 is symmetric: $m = 0$, and codes 0 to 15 denote −8 to 7 times the step. Writing $\hat{w} = d(q - 8)$ and writing $\hat{w} = dq + m$ with $m = -8d$ describe the same thing; the difference is whether $m$ is stored separately and can be chosen independently. The exception to "no more than half a step" is the saturating end, covered in the notes of the previous page.
'''

['q4-block.title']
src_hash = '9fdf7c56'
text = 'The Q4_0 block'

['q4-block.slide.1']
src_hash = 'e4142b95'
text = '''
- Every 32 consecutive weights form a block, sharing one FP16 scale (2 bytes)
- The 32 four-bit codes are packed into 16 bytes, two codes to a byte
'''

['q4-block-cont.title']
src_hash = '9fdf7c56'
text = 'The Q4_0 block'

['q4-block-cont.slide.1']
src_hash = '245ef6b4'
text = '''
- The 4-bit codes $0 \sim 15$ map to the integers $-8 \sim +7$, asymmetric in the same way as two's complement
- A block takes 18 bytes, an average of <mark>4.5 bits</mark> per weight (about 3.56× smaller than FP16)
'''

['q4-block-cont.highlight.1']
src_hash = '9b475236'
text = 'By letting 32 elements share a scale, Q4_0 bounds the local quantization error at a very small metadata cost.'

['quantize-code.title']
src_hash = 'cc7e6521'
text = 'Implementing Q4_0 quantization'

['quantize-code.demo.1.name']
src_hash = 'b88704a7'
text = 'Quantizing a group of weights and reconstructing them'

['quantize-code.notes.1']
src_hash = '12db95b1'
text = '''

Two places are easy to get wrong. First, the scale is the weight of largest absolute value in the block, taken with its sign and divided by −8, so that this weight encodes as 0 and all 16 codes are reachable; using absmax/7 instead confines the codes to 1..15. Second, the pairing: the low nibble holds weight $j$ and the high nibble weight $j+16$, so a pair spans the two halves of the block. llama.cpp quantizes with a floating-point d and stores d back as FP16, so the two differ slightly and the actual error can therefore exceed half a step by a little.
'''

['nibble-packing.title']
src_hash = 'd8e9504e'
text = 'Packing and reading nibbles'

['nibble-packing.slide.1']
src_hash = '00232001'
text = 'The byte is the smallest addressable unit of memory. 4-bit data (a half byte, a nibble) cannot be addressed on its own and must be packed two to a byte.'

['nibble-packing.slide.2']
src_hash = '914af9b2'
text = '''
- Reading the low 4 bits: the bitwise-and mask `b & 0x0f` extracts the value
- Reading the high 4 bits: the logical right shift `b >> 4` moves the high nibble down to the lowest bits
- Packing: shift the high 4 bits left by 4 (`hi << 4`), then combine with the low 4 bits by bitwise or (`|`)
- Q4_0 layout: weight $j$ of the block is paired with weight $j+16$, so the low and high halves of a byte hold the first and second halves of the block
'''

['nibble-add.title']
src_hash = 'f625f6c4'
text = 'Parallel addition on packed nibbles'

['nibble-add.slide.1']
src_hash = 'd9fb0a7d'
text = 'When one byte packs two independent 4-bit integers, ordinary byte addition lets the carry out of the low field overflow into the high field.'

['nibble-add.slide.2']
src_hash = '9296f665'
text = '''
- `& 0x77` masks off the top bit of both 4-bit fields (bits 3 and 7), so the carry from adding the low 3 bits stays inside its own field
- `(a ^ b) & 0x88` computes the half-adder sum of the top bits (xor produces no carry across fields) and merges it with the low-bit sum by xor
'''

['nibble-add.notes.1']
src_hash = '0c1a59be'
text = '''

This page is where part three's bitwise material lands. Take `0x29 + 0x38` (fields 9+8 and 2+3): adding directly gives `0x61`, where 9+8=17 overflows the low field and carries a 1 into the high one; `add_packed` gives `0x51`, where the low field wraps to 1 and the high field is still 5. `examples/int4.c` checks both forms against all 65536 pairs of inputs: adding directly is wrong on 30720 of them, `add_packed` on none.
'''

['nibble-add-cont.title']
src_hash = 'f625f6c4'
text = 'Parallel addition on packed nibbles'

['nibble-add-cont.slide.1']
src_hash = 'b5597237'
text = '- The overflow of each field is simply truncated, so two independent 4-bit fields are added in parallel within one byte (the SWAR technique)'

['nibble-add-cont.highlight.1']
src_hash = 'ce7d5eb7'
text = 'The key to arithmetic on packed data is isolating the fields, so the carry of the low field cannot reach the high field.'

['granularity.title']
src_hash = '0e114a60'
text = 'Quantization granularity'

['granularity.slide.1']
src_hash = '05290bfa'
text = '- The scales themselves take space: metadata bits per weight = total scale bits ÷ group size (an FP16 scale over 32 weights is $16 \div 32 = 0.5$ bits per weight)'

['granularity.notes.1']
src_hash = 'fe426a6a'
text = '''

The bit overheads of the three granularities in the figure are 0, 16/256 = 0.0625 and 16/32 = 0.5 bits. The per-tensor row is drawn dashed because its coefficient is shared by the whole tensor and does not belong to the 256 weights shown.
'''

['granularity-cont.title']
src_hash = '0e114a60'
text = 'Quantization granularity'

['granularity-cont.slide.1']
src_hash = 'dce1bc52'
text = '- The smaller the group, the narrower its local range, the smaller the step and the higher the precision; but the storage taken by the scales grows accordingly'

['granularity-cont.highlight.1']
src_hash = '959d34c9'
text = 'Granularity is the central parameter trading compression (storage size) against precision (numerical error).'

['granularity-measured.title']
src_hash = '11a80ea0'
text = 'Error at three granularities'

['granularity-measured.demo.1.name']
src_hash = 'e841fe78'
text = 'One group of weights, three granularities'

['granularity-measured.slide.1']
src_hash = '234de742'
text = 'The sample is the `ffn_down` weight tensor in layer 0 of the real model Llama-3.2-1B (4096 parameters). `rel.rmse` is the root mean square error divided by the root mean square of the weights (the relative RMS error).'

['granularity-measured.highlight.1']
src_hash = '4c74f511'
text = 'Refining the granularity from the whole tensor to 32 elements (0.5 more bits of metadata per weight) lowers the relative RMS error from 13.50% to 8.42%.'

['granularity-measured.notes.1']
src_hash = 'f1b02b1e'
text = '''

This set of data is approximately symmetric about 0, so Q4_0 and Q4_1 differ little and granularity is the dominant factor. The other set of data in the next section is not like this. The Q4_1 and Q4_K rows of the table have not been covered yet, so in class only the first three rows need be read; the source of `quant_compare.c` is behind the button, with all five approaches in one file. The sample file and its licence note are in `examples/ext/`.
'''

['section.quant-formats.title']
src_hash = '22e67b8c'
text = 'Part seven · Quantization formats: Q4_1 and Q4_K'

['zero-point.title']
src_hash = 'b24073d3'
text = 'Asymmetric quantization and Q4_1'

['zero-point.slide.1']
src_hash = 'ea91f80e'
text = '''
- The symmetric step is set by the largest magnitude in the block; when the weights sit away from 0, the grid must also cover empty ranges and many levels go unused
- Q4_1 also stores an FP16 block minimum (the offset $m$), so the step follows the actual range and all 16 levels cover the data
'''

['zero-point.notes.1']
src_hash = '3d487e37'
text = '''

The 32 weights of the block in the figure lie between 1.539 and 2.625. Q4_0's step is 2.625/8 = 0.328, and only 4 of the 16 levels fall inside that interval; Q4_1's step is (2.625 − 1.539)/15 = 0.0724, and all 16 levels fall inside it. The two differ by a factor of 4.5. This is also one reason GGUF keeps the normalization coefficients in F32: the values of such tensors cluster around 1, where symmetric quantization wastes the most, and their parameter count is small enough that the error is not worth a few saved KB.
'''

['zero-point-cont.title']
src_hash = 'b24073d3'
text = 'Asymmetric quantization and Q4_1'

['zero-point-cont.slide.1']
src_hash = '55693e67'
text = '- A block holds a 2-byte step, a 2-byte minimum and 16 bytes of codes, 20 bytes in all, an average of <mark>5.0 bits</mark> per weight'

['zero-point-cont.highlight.1']
src_hash = 'c2ca5f2c'
text = 'Symmetric quantization forces its 16 levels to lie symmetrically over $[-\max, \max]$; skewed data loses a great deal of precision.'

['q4-1-measured.title']
src_hash = '03a6442f'
text = 'Asymmetric quantization, measured'

['q4-1-measured.demo.1.name']
src_hash = 'f705ab19'
text = 'A group of weights that are all positive'

['q4-1-measured.slide.1']
src_hash = '4ff0ba9f'
text = "The sample is a layer-normalization weight of the model's output layer (2048 positive values, mean about 2.35). Compared with the symmetric Q4_0, Q4_1 spends 0.5 more bits on the block minimum and lowers the relative RMS error from 4.25% to 0.94%."

['q4-1-measured.highlight.1']
src_hash = '60bf1679'
text = 'For data that sits away from 0, finer granularity helps little; an adaptive zero point makes the decisive difference.'

['q4-1-measured.notes.1']
src_hash = '876f8363'
text = '''

Per-tensor comes out slightly better than per-256 and Q4_0 because the waste of symmetric quantization here is structural: the step is set by the distance from 0, which no amount of finer grouping changes, while with one coefficient for the whole tensor the maximum happens to be a little larger than each block's maximum, so the step does not grow much worse. The error ratio 4.25/0.94 = 4.5 agrees with the step ratio 0.328/0.0724 = 4.5 computed on the previous page.
'''

['superblock.title']
src_hash = '8730dd79'
text = 'The Q4_K superblock'

['superblock.slide.1']
src_hash = 'a006d464'
text = '''
- Each superblock holds 256 weights in 8 sub-blocks of 32; each sub-block keeps its own step and offset for a close fit
- The steps and offsets of the 8 sub-blocks, 16 parameters, are quantized again to 6-bit unsigned integers, 12 bytes in all ($16 \times 6 = 96$ bits)
'''

['superblock.notes.1']
src_hash = 'fb72a963'
text = '''

Two-level means this: the superblock stores two fp16 values, one the common scale of the 8 sub-block steps and the other the common scale of the 8 sub-block offsets; a sub-block's step is written as a 6-bit integer times the superblock step, and likewise for the offset. Reconstructing one weight begins by reconstructing the coefficients of the sub-block it belongs to. In llama.cpp this structure is called K-quants, and Q2_K through Q6_K share the same superblock layout, differing only in the number of bits in the code and in how the sub-blocks are divided.
'''

['superblock-cont.title']
src_hash = '8730dd79'
text = 'The Q4_K superblock'

['superblock-cont.slide.1']
src_hash = '7c468c52'
text = "- Dequantization is $\\hat{w} = d \\cdot sc \\cdot q - d_{\\min} \\cdot m$, where $sc$ and $m$ are the sub-block's 6-bit parameters and $d$ and $d_{\\min}$ are the superblock's global FP16 scales"

['superblock-cont.highlight.1']
src_hash = 'a3cb2751'
text = 'Q4_K compresses its metadata with a second level of quantization, reaching close to the precision of the 5.0-bit Q4_1 at 4.5 bits overall.'

['q4-k-budget.title']
src_hash = '371a6df4'
text = 'The storage cost of Q4_K'

['q4-k-budget.table.1.cell.0.0']
src_hash = '49ecd0e3'
text = 'Field'

['q4-k-budget.table.1.cell.0.1']
src_hash = 'b2643696'
text = 'Contents'

['q4-k-budget.table.1.cell.0.2']
src_hash = 'f5a08785'
text = 'Bytes'

['q4-k-budget.table.1.cell.1.0']
src_hash = '2ca317f3'
text = '`qs`'

['q4-k-budget.table.1.cell.1.1']
src_hash = '7d815fd5'
text = '256 four-bit weight codes'

['q4-k-budget.table.1.cell.1.2']
src_hash = '56dc298f'
text = '128 bytes'

['q4-k-budget.table.1.cell.2.0']
src_hash = '87f12aef'
text = '`scales`'

['q4-k-budget.table.1.cell.2.1']
src_hash = '112fbbf9'
text = '8 six-bit steps + 8 six-bit offsets (16 × 6 = 96 bits)'

['q4-k-budget.table.1.cell.2.2']
src_hash = 'b394993e'
text = '12 bytes'

['q4-k-budget.table.1.cell.3.0']
src_hash = 'e3e269ca'
text = '`d`, `dmin`'

['q4-k-budget.table.1.cell.3.1']
src_hash = 'bfde603b'
text = 'Global step and offset scales of the superblock (2 FP16 values)'

['q4-k-budget.table.1.cell.3.2']
src_hash = '1f7ebe31'
text = '4 bytes'

['q4-k-budget.table.1.cell.4.0']
src_hash = 'e009c148'
text = 'Total'

['q4-k-budget.table.1.cell.4.1']
src_hash = 'e94e16d3'
text = 'One superblock (256 weights)'

['q4-k-budget.table.1.cell.4.2']
src_hash = '317fff79'
text = '144 bytes'

['q4-k-budget.slide.1']
src_hash = 'c24dfeb7'
text = '''
- Average width of a superblock: $144 \text{ bytes} \times 8 \div 256 = \mathbf{4.50} \text{ bits per weight}$, exactly the same as the symmetric Q4_0
- If the 16 sub-block parameters were stored as uncompressed FP16, the superblock would grow to $128 + 32 = 160$ bytes (5.0 bits per weight, the same as Q4_1)
- The 16 bytes saved come entirely from compressing the 16 parameters from 16 bits to 6 bits by second-level quantization
'''

['q4-k-budget.highlight.1']
src_hash = '6e8a30a3'
text = 'By quantizing the quantization parameters themselves, Q4_K keeps the size of Q4_0 while reaching close to the precision of Q4_1.'

['q4-k-budget.notes.1']
src_hash = '300b42b4'
text = '''

The 160-byte figure is not hypothetical: a Q4_1 block is 32 weights in 20 bytes, and 8 such blocks are exactly 160 bytes, with the same number of coefficients. The only difference between Q4_K and Q4_1 is how those 16 coefficients are stored. The 4 bytes of `d` and `dmin` are the price paid for compressing the coefficients, which spread over 256 weights is 0.125 bits.
'''

['k-scales-layout.title']
src_hash = 'a468315f'
text = 'The bit layout of the Q4_K coefficients'

['k-scales-layout.slide.1']
src_hash = 'e263cecf'
text = '**16 six-bit parameters take 96 bits, exactly 12 bytes. To use every bit and leave nothing redundant, some parameters are stored across byte boundaries.**'

['k-scales-layout.notes.1']
src_hash = 'eaa68275'
text = '''

This is the densest use of this lecture's bitwise material in a real format: not a single bit is empty, so no convenient reading gets it right and the bits must be taken by definition. The place that is easy to get wrong is the last four values: their low 4 bits are in bytes 8 through 11 and their high 2 bits in bytes 0 through 7, the two pieces come from different bytes, and reversing the order of the concatenation raises no error, only making every reconstructed weight uniformly too large or too small.
'''

['k-scales-layout-cont.title']
src_hash = 'a468315f'
text = 'The bit layout of the Q4_K coefficients'

['k-scales-layout-cont.slide.1']
src_hash = '146d90e2'
text = '''
- A 6-bit field does not divide an 8-bit byte evenly, so packing them contiguously puts some fields across bytes
- The low 6 bits of the first 8 bytes hold the first 4 steps and first 4 offsets; their spare top 2 bits hold the high bits of the last 4 steps and offsets
- The last 4 steps and 4 offsets are split into a high 2 bits and a low 4 bits, stored in different bytes
'''

['k-scales-layout-cont.highlight.1']
src_hash = 'c53952c9'
text = 'Every bit of the layout is used, so unpacking must follow the masks and shifts exactly.'

['k-scales-code.title']
src_hash = '988bb084'
text = 'Decoding the Q4_K coefficients'

['k-scales-code.slide.1']
src_hash = '46ff9634'
text = '''
- The extracted sub-block parameters $sc$ and $m$ are 6-bit unsigned integers (range $0 \sim 63$), and the global scale $d_{\min} \ge 0$, so the offset term $-d_{\min} \cdot m \le 0$
- The lower bound a sub-block can represent is therefore $\le 0$, a structural limitation of the format on all-positive weights
'''

['k-scales-code.highlight.1']
src_hash = 'fc0bae9a'
text = 'Decoding takes the low 6 bits with the mask `& 63` and rebuilds the high 2 bits stored in another byte with the shifts `>> 6` and `<< 4`.'

['k-scales-code.notes.1']
src_hash = '9c95630c'
text = '''

For an example: with `sc[0] = 63` and `sc[4] = 62`, byte 0 is `0xff`, whose low 6 bits are 63 and whose high 2 bits `11` are the top two bits of 62; the low 4 bits `e` of byte 8, `0x9e`, are the low four bits of 62. Writing and reading must come in pairs, and `examples/k_scales.c` holds both functions, ready to run if someone asks in class. That the offset is at most 0 follows jointly from llama.cpp's quantizer and this storage format: `make_qkx2_quants` contains the line `if (min > 0) min = 0;`, and the format itself can store only a non-negative `m`.
'''

