['clipping-tradeoff.title']
src_hash = '3645bd24'
text = ''
# src: 离群点困境：动态范围与局部精度的零和博弈

['clipping-tradeoff.slide.1']
src_hash = '0337335a'
text = ''
# src:
# 
# - **模型权重的钟形分布特征**：绝大部分数值密集聚集在 0 附近，两翼伴随少量极端离群值。
# - **策略 A：MinMax 准则**
#   - 强制覆盖最大极值：$w_{\max} = \max|W|$。
#   - **弊端**：只要有一个离群尖刺，步长 $S = w_{\max}/q_{\max}$ 就会被暴力拉大，导致处于中间的 99.9% 正常权重全被挤压在 0 附近的极少数离散桶中，**舍入误差剧增**。
# - **策略 B：饱和截断准则**
#   - 设定阈值 $T \ll \max|W|$，超出 $T$ 的数据强行截断为 $T$。
#   - **收益**：步长 $S = T / q_{\max}$ 显著缩小，核心有效区域网格致密；
#   - **代价**：两端尾部承担**截断误差**。
# - **核心权衡**：以可控的截断代价，换取全量参数平均舍入噪声的最小化。

['clipping-tradeoff.slide.1.footnote.1']
src_hash = '5098080c'
text = ''
# src: 文献出处：Zhao, R. et al. *Improving Neural Network Quantization without Retraining*, ICML (2019).

['clipping-tradeoff.notes.1']
src_hash = '12af8490'
text = ''
# src:
# 
# 动态范围的截断本质上是统计分布中的方差权衡。MinMax 准则为了迁就极少数极端离群点，不惜
# 拉大整个量化网格刻度，导致占据 99% 的核心分布数据丧失了分辨精度；而饱和截断则是主动舍弃
# 尾部极值，换取主体密集区间内极其细密的网格步长。系统工程从不追求教条式的绝对无损，而是
# 追求全分布期望误差的最小化。

