# 
# 全 0 与全 1 被保留，8 位阶码的实际指数范围是 −126 到 127。
# 非规格化数取消前导的 1，使零附近的可表示值保持均匀间隔，下溢因此逐步发生。
# 非规格化数的 $E$ 取 $-126$ 而非 $-127$，是为了让最大的非规格化数与最小的
# 规格化数首尾相接，中间不出现间隙。低精度格式沿用同一套规则：FP8 E4M3 的
# 可表示值里，非规格化数占了相当一部分。

