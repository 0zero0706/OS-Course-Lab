['kernel-bug-answer.slide.2']
src_hash = '81a430ce'
text = '''
**When the caller passes a negative `maxlen`:**
- `KSIZE < maxlen` compares signed, is false, and `len` becomes that negative value
- `memcpy` takes a `size_t`, so `len` becomes huge and the copy passes the buffer end
'''
# src:
# 
# **调用方传入负的 `maxlen` 时：**
# - `KSIZE < maxlen` 是有符号比较，结果为假，`len` 取到那个负值
# - `memcpy` 的第三个参数是 `size_t`，`len` 转换成极大的无符号数，越过缓冲区边界

['kernel-bug-answer.notes.1']
src_hash = '5db925dd'
text = "This code is modelled on a defect that appeared in FreeBSD's getpeername implementation. `maxlen` comes from the caller, and the return value is the number of bytes actually copied. Worth pointing out in class: this class of error produces no diagnostic at compile time and does not necessarily crash at run time, surfacing only on particular inputs. When reviewing generated code, mixing signed and unsigned is one of the first things to check."
# src:
# 
# 这段代码源自 FreeBSD 的 getpeername 实现中出现过的缺陷。`maxlen` 由调用方给出，
# 返回值是实际拷贝的字节数。课堂上可以指出：这类错误在编译时没有任何提示，
# 运行时也不一定立刻崩溃，只有在特定输入下才暴露。
# 审查生成的代码时，有符号与无符号的混用是需要优先检查的一类。

