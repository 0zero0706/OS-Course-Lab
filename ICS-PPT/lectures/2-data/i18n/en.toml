['bool-storage.aside.1']
src_hash = '75901d06'
text = 'To store many booleans bit by bit, a program packs them itself: C uses bit fields or integer masks, C++ offers bitwise storage through `std::vector<bool>`.'
# src: 如需节省空间，通过按位存放大量布尔值时，需要程序自己打包：C 用位域或整数掩码，C++ 可通过 `std::vector<bool>` 按位存储。

['bool-storage.notes.1']
src_hash = 'a9de994e'
text = '''

The bitwise form in C is the bit field: `struct { unsigned a : 1, b : 1; }`. The order in which the bits are laid out is implementation-defined, so bit fields are unsuited to describing a file format — reading the same bytes with a different compiler gives a different result.
'''
# src:
# 
# C 里按位存放的写法是位域：`struct { unsigned a : 1, b : 1; }`，位的排列次序由实现决定，
# 因此位域不适合用来描述文件格式，跨编译器读同一段字节会得到不同结果。

