# - **几何分布特征**：
#   - 阶码 $E$ 确定基准区间 $[2^E, 2^{E+1})$；尾数字段（23 位）将该区间均分为 $2^{23}$ 等份。
#   - 每越过一个 2 的整次幂，相邻可表示值的间距翻倍，实数轴上的网格密度呈指数级衰减。
# - **末位单元 ULP 与绝对误差**：
#   - 区间 $[2^E, 2^{E+1})$ 内的网格间距为 $\text{ULP} = 2^{E-23}$。
#   - 绝对误差上界随数值量级的增大呈指数增长。
# - **相对精度的恒定性**：
#   - 相对分辨率上限保持恒定：$\frac{\text{步长}}{\text{区间起点}} = \frac{2^{E-23}}{2^E} = 2^{-23} \approx 1.19 \times 10^{-7}$。
#   - 对应十进制约 7 位有效数字。

