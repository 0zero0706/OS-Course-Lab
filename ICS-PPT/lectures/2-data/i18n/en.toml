text = '''

The lab instructions are distributed separately. The model file is 4.25 GB under the Apache-2.0 licence with no application required, and on the campus network there is an internal mirror. The file holds 625 tensors, of which 315 belong to the vision tower, and the lab handles only the 310 of the language model. The product is about 1.10 GB. Generation uses greedy decoding, and the md5 of the output text is one per student, for self-checking. Every section of this lecture lands somewhere in the lab: little-endian assembly for part two, the bit layout of BF16 for part five, and masks and shifts for this section.
