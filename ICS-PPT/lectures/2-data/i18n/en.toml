- **File parsing**: read the 8-byte little-endian unsigned header length, then the JSON header for each tensor's type, shape and offsets
- **Type conversion**: widen BF16 to single-precision FP32 (from part 5: a left shift of 16 bits)
- **Quantization**: implement `quantize` and `dequantize` for Q4_0, Q4_1 and Q4_K
- **Verification**: check the byte size and checksum of the output file, verify the error bound, and run one step of inference
'''

