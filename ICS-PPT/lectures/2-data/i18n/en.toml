['model-size.table.1.cell.4.1']
src_hash = '32209ccb'
text = '4.5'

['model-size.table.1.cell.4.2']
src_hash = 'ea57a26d'
text = '1.81 GB'

['model-size.table.1.cell.4.3']
src_hash = '8329a5ec'
text = 'the common choice for local inference'

['model-size.slide.1']
src_hash = '8f39efc8'
text = '''

- 4-bit quantization costs <mark>4.5</mark> bits per weight rather than 4: the 4 bits are the code itself, and the other 0.5 is each weight's share of the FP16 scale shared by every 32 weights (2 bytes ÷ 32 weights = 0.5 bits)
- Generating one token requires reading every parameter once, so the bit width of the format sets the <mark>memory traffic</mark> in proportion
'''

['model-size.notes.1']
src_hash = 'c2806244'
text = '''

The table uses decimal GB: 3.21 B × 4.5 bits ÷ 8 = 1.81 GB. That row describes a single 4-bit format. The file actually downloaded is a mixture of several formats (llama.cpp calls it Q4_K_M): most tensors are Q4_K (4.5 bits), the token embedding table and the attn_v and ffn_down of some layers are raised to Q6_K (6.56 bits), and the normalization coefficients stay F32, for a weighted average of 5.01 bits, or 2.02 GB. The 1.9G that `ls -lh` reported in lecture 1 is GiB, and 2.02 GB is 1.88 GiB. These numbers are worth having when a student asks whether it all adds up; `examples/gguf_bits.py` will tally a whole file.
'''

