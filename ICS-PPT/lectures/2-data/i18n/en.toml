['fp32-myth.title']
src_hash = '7157b11e'
text = ''
# src: 破局：高精度神话的破灭

['fp32-myth.slide.1']
src_hash = '598cc8d9'
text = ''
# src:
# 
# - **IEEE 754 FP32 的历史使命**：
#   - 23 位尾数带来约 7 位有效十进制精度：$2^{23} \approx 8.4 \times 10^{6}$，量级为 $10^{7}$。
#   - **设计初衷**：满足天体轨道仿真、偏微分方程收敛等传统科学计算对极微小累积误差的严苛要求。
# - **大模型的参数与表征本质**：
#   - 现代大模型是典型的**超大规模过参数化系统**，拥有千亿至万亿级的参数。
#   - **自注意力机制的核心逻辑**：推理时模型依赖的是 Softmax 归一化后的注意力分布排序关系，以及激活通道之间的相对强弱对比，而非浮点尾数后十几位的绝对数值。
#   - **核心认知**：注意力概率分布对参数尾数的微小舍入完全钝化，大模型的生成质量并不取决于微观数字的绝对精度。
# - **系统结论**：在大模型时代强行沿用传统科学计算的高能耗、大位宽 FP32，不仅在算力和显存上存在极大浪费，还会成倍增加自回归推理需要搬运的字节数，加剧“显存带宽”的限制。

['fp32-myth.slide.1.footnote.1']
src_hash = '1d1cefd7'
text = ''
# src: 文献出处：Goldberg, D. *What Every Computer Scientist Should Know About Floating-Point Arithmetic* (1991).

['fp32-myth.notes.1']
src_hash = 'c4b71bde'
text = ''
# src:
# 
# 如果发射火箭，浮点数第 6 位发生截断，飞船可能偏离火星轨道；但在千亿参数大模型时代，海量
# 参数赋予了模型极强的拓扑容错能力。大模型真正在乎的是注意力权重的相对分布与激活值的语义序
# 关系，根本不需要尾数最后十几位的绝对数值。用昂贵且耗电的 FP32 浮点单元去承载具有天然高
# 容错性的大模型，在显存带宽和能耗上造成了巨大的物理浪费。摆脱对传统高精度的盲目迷信，是大
# 模型系统优化的第一步。
# 
# 7 位是量级估算：23 位二进制尾数能区分 $2^{23} \approx 8.4 \times 10^{6}$ 个值，与 7 位十进制数能区分的
# $10^{7}$ 个值同一量级。换一个角度，相邻两个 FP32 数的相对间距约为 $2^{-23} \approx 1.2 \times 10^{-7}$，
# 误差出现在第 7 位十进制数字附近。算上隐含的首位 1，有效位是 24 位，$\log_{10} 2^{24} \approx 7.2$，结论相同。

