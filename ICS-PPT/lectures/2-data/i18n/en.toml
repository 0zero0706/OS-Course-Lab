The data in the table comes from `examples/gguf_bits.py`, which by default reads the largest blob ollama downloaded, that is lecture 1's llama3.2 (3.21 B parameters), and counts 255 tensors, a weighted average of 5.009 bits, 2 011 539 712 bytes of tensor data and 7 837 658 bytes of metadata. The 255 tensors are 28 layers × 9 plus the token embedding, the output normalization and `rope_freqs`. In llama.cpp's naming, `_S`, `_M` and `_L` differ in how many tensors are raised in precision, and which tensors those are is found by trying them one at a time on a calibration set rather than derived from the format itself.
'''

['quantization-cost.title']
src_hash = 'd845d151'
text = 'The cost and limits of quantization'

['quantization-cost.slide.1']
src_hash = 'ab4f2ef3'
text = '''
- Quantization error grows with the range of the data, and a few outliers widen the overall step
- The finer the grouping, the more metadata the scales take, and the higher the average effective width
- Static weights usually compress to 4 bits, while activations vary widely, and industry usually keeps them at 8-bit or 16-bit floating point
- Dequantization adds computation; the speedup comes mainly from the large reduction in data read from memory
'''

['quantization-cost.image.1.caption']
src_hash = '71626512'
text = 'LLM.int8() mixed-precision matrix multiplication: the feature columns containing outliers are computed in 16-bit floating point, the other columns in INT8'

['quantization-cost.image.1.footnote.1']
src_hash = '5f20608f'
text = 'Figure from Dettmers et al., LLM.int8() (NeurIPS 2022), Figure 2, CC BY 4.0.'

['quantization-methods.title']
src_hash = 'a532db22'
text = 'A classification of advanced quantization methods'

['quantization-methods.slide.1']
src_hash = 'c71703d5'
text = 'Basic uniform linear quantization divides the range into equal intervals; quantization of modern large models builds on it along four main directions:'

['quantization-methods.slide.2']
src_hash = '375925db'
text = '''
- **Adaptive zero point**: Q4_1 stores a separate minimum, avoiding wasted range when one-signed weights are quantized symmetrically
- **Hierarchical superblocks**: Q4_K uses a layered superblock structure and quantizes the sub-block scales and offsets again to compress metadata
- **Second-order and activation calibration**: GPTQ compensates quantization error using the second-order Hessian, and AWQ protects important channels according to activation salience
- **Non-uniform grids**: NF4 (NormalFloat4) places unequally spaced levels at the quantiles of the normal distribution, maximizing the information entropy of the codes
'''

['quantization-methods.highlight.1']
src_hash = '6f97855d'
text = 'Uniform linear quantization is built on an equally spaced grid; advanced methods keep pushing the precision limit through asymmetry, hierarchical representation, non-uniform grids and error compensation.'

['quantization-methods.notes.1']
src_hash = 'd42fbe77'
text = '''

The Q4_K_M measured on the previous page is a product of the grouping direction: on top of Q4_K, it raises the tensors where quantization error matters most to 6 bits. NF4 comes from QLoRA and takes its levels at the quantiles of the standard normal, giving a smaller error on weight blocks that have already been normalized. AWQ and GPTQ both need a small batch of calibration data and are forms of post-training quantization; quantization-aware training is a separate route whose cost is retraining, and this section does not cover it.
'''

