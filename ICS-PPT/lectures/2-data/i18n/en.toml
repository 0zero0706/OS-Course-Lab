['recap-weights.notes.1']
src_hash = 'a23c0f7f'
text = '''

Lecture 1 ended on "the model supplies only parameters; the execution is carried out by the system stack". This lecture unfolds the word "parameter": in what format the parameters are written to the file, what they are in memory once read, and why the file is 1.9 GB rather than 12.8 GB. The commands of this lecture run on x86-64 Linux, on arm64 macOS and in WSL2 on Windows, with the same results; the two pages that look at assembly follow the instruction set. The README has the differences page by page.
'''
# src:
# 
# 第一讲的落点是「模型只提供参数，执行过程由系统栈完成」。本节把「参数」这个词展开：
# 参数以什么格式写在文件里，读出来之后在内存中是什么，为什么是 1.9 GB 而不是 12.8 GB。
# 本讲的命令在 x86-64 的 Linux、arm64 的 macOS 与 Windows 的 WSL2 上都可以执行，
# 结果一致；查看汇编的两页随指令集变化，逐条差别见 README 的「跨平台」一节。

