['recap-weights.slide.1']
src_hash = '39de2758'
text = '''
**We took one `ollama run` and examined the layers of the system from the bottom up**
- The weights are a 1.9 GB file, and `file` reports `data` — it cannot identify the type
- The file holds no executable instructions; all of its content is data
- The operating system pages it into memory on demand, without interpreting a single byte
'''
# src:
# 
# **我们以一次 `ollama run` 为例，自底向上考察了系统各层**
# - 模型权重是一个 1.9 GB 的文件，`file` 给出的结果是 `data`，即未能识别其类型
# - 文件中不含任何可执行指令，全部内容是数据
# - 操作系统按需把其中的页装入内存，但没有解释过任何一个字节的含义

