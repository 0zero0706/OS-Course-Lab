text = '''
- On symmetric data Q4_K reaches an error as low as Q4_1, while its size equals Q4_0 at 4.5 bits per weight
- On all-positive data Q4_K errs more than Q4_1, mainly because the format forces its offset term to be non-positive
'''

['q4-k-measured.highlight.1']
src_hash = '2ec2b5c4'
text = 'Under the same average width, a better organization of the parameters and second-level quantization narrow the error considerably.'

['q4-k-measured.notes.1']
src_hash = 'da8332b0'
text = '''

Restricting the offset to at most 0 is llama.cpp's choice (`if (min > 0) min = 0;`): almost every weight tensor straddles 0, releasing the restriction gains little, and with it in place 0 is always exactly representable. The two error columns on this page are the last three rows of the two earlier measurements. llama.cpp's actual Q4_K quantizer also searches over several candidate (step, offset) pairs, doing a little better than the version here that computes them directly from the minimum and the maximum.
'''

