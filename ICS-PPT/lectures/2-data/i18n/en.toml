['zero-point-compute.slide.2.footnote.1']
src_hash = '62778654'
text = ''
# src: 文献出处：Jacob, B. et al. CVPR (2018); Krishnamoorthi, R. *Quantizing deep convolutional networks for efficient inference: A whitepaper* (2018).

['zero-point-compute.notes.1']
src_hash = 'bd17a441'
text = ''
# src:
# 
# 逐项先减零点再相乘的做法最直接，但 8 位码减去零点之后取值范围是 $[-255, 255]$，需要
# 9 位，只能改用 16 位乘法，每条指令完成的乘加数减半。展开之后，① 仍是纯 8 位整数点积，零点带来的工作集中在 ②：推理时对激活的整数码求和。
# 这个和对同一行激活只需求一次，由该行的所有输出列共用。以 Llama-3.2-1B 的一个
# 2048 × 2048 投影矩阵、生成 1 个 token 为例，① 约 419 万次乘加，② 为 2048 次加法。
# 
# GGUF 的 Q4_1 把反量化写作 $\hat{w} = d\,q + m$，$m$ 对应这里的零点项。llama.cpp 把激活
