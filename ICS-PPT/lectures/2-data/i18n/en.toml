['ieee-form.notes.1']
src_hash = '6805ff9f'
text = '''
The figure is the FP32 encoding of 3.1415927: sign bit 0, exponent field 128, significand $M = 1.5708$, $E = 1$.
This matches binary scientific notation $1.bb\ldots \times 2^{E}$: the sign is taken out and $M$ is confined to $[1.0, 2.0)$,
so every nonzero number has exactly one way of being written. The fields run from the high bits to the low bits, with the sign as the top bit.
In C, `float` is single precision and `double` is double precision. The next pages give the rules for encoding the two fields.
'''
