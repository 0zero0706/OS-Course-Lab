['frac-to-bits.notes.1']
src_hash = 'b6b987c0'
text = '''
This loop is the multiply-by-two method from the previous page.
Whenever doubling makes the integer part 1, the current bit is set and 1 is subtracted; `current_bit` shifts right by one each round to point at the next bit.
If doubling gives exactly 1, the fraction is used up and the loop stops early; 0.2 never runs out within 32 rounds.
'''
# src:
# 
# 这段循环就是上一页的乘二取整。
# 每次乘 2 后整数部分为 1，就在当前位写 1 并减去 1；`current_bit` 每轮右移一位，指向下一位。
# 乘 2 后恰好等于 1 时小数已经取尽，提前结束；0.2 在 32 轮内始终取不尽。

