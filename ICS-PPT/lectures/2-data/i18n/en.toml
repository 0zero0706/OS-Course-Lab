['section.float-formats.title']
src_hash = '5ea00915'
text = 'Part five · Floating-point precision and low-precision formats'

['float-distribution.title']
src_hash = 'c02d1dd6'
text = 'How floating-point values are distributed on the real line'

['float-distribution.slide.1']
src_hash = '3bd9fd07'
text = '''
- The exponent selects an interval $[2^E, 2^{E+1})$ and the fraction divides it into $2^n$ equal parts; each power of two crossed doubles the step
- The step is proportional to the value: absolute precision falls as values grow, while <mark>relative precision</mark> stays constant
'''

