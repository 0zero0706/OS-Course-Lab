['summary.title']
src_hash = '5f41b7e0'
text = 'Summary'
# src: 课程小结

['summary.slide.1']
# CHANGED: was cf01b0f8
src_hash = '2d2ff598'
text = '''
- **Bytes and addressing**: 8 binary bits, written as 2 hexadecimal digits, the smallest addressable unit of memory
- **Multi-byte storage and byte order**: set by the architecture's byte order; modern general-purpose processors (x86-64, ARM64) and the GGUF format use little-endian
- **Binary encoding of integers**: two's complement gives the top sign bit a negative weight, and implicit conversions between signed and unsigned numbers are a common source of security bugs
- **Real numbers and model quantization**: floating point divides bits among sign, exponent and fraction; group quantization compresses weights to 4 bits, greatly easing the memory bottleneck
'''
# src:
# 
# - **字节概念与寻址单位**：8 个二进制 Bits 组合，对应 2 位十六进制数，是内存寻址的最小基本单位
# - **多字节存储与字节序**：由体系结构字节序规定，现代通用处理器（x86-64、ARM64）及 GGUF 格式普遍采用小端序
# - **整数二进制编码规则**：补码赋予最高符号位负权重，有符号数与无符号数之间的隐式转换是常见的安全缺陷来源
# - **实数表示与模型量化**：浮点数分配符号、阶码与尾数；分组量化技术将权重压缩至 4 位宽，大幅降低内存访存瓶颈

['summary.slide.2']
# CHANGED: was 865739e6
src_hash = 'd6e86b83'
text = '''
Bits carry no meaning of their own; their meaning depends entirely on the rule that interprets them (format specifications, type systems and hardware conventions).
Implicit semantics at type conversions and bit operations do not trigger compile errors, so developers must review code carefully.
'''
# src:
# 
# 数据比特本身不具有固有语义，其含义完全取决于解释规则。
# 类型转换与位操作边界处的隐式语义不会触发编译报错，需要开发者保持严谨的代码审查意识。

['summary.highlight.1']
src_hash = '02539e55'
text = 'Before interpreting a sequence of bytes, first determine its data type and the rule for parsing it.'
# src: 解释字节序列之前，必须首先明确其数据类型与解析规范。

['summary.notes.1']
src_hash = '8cc177b2'
text = 'These four together are all the conventions needed to read 1.9 GB of bytes as a model. One more sentence can connect them to what follows: in machine-level programs immediate values and addresses are likewise stored little-endian; in the memory hierarchy the bit width of the data directly sets the memory traffic per token; and the object files that linking and dynamic loading handle are equally byte sequences with a specification, approached the same way.'
