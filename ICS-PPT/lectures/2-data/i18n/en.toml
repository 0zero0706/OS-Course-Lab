# src: C 语言浮点转换规则、精度损失与未定义行为

['casts-ub.slide.1']
src_hash = 'f2002f5d'
text = ''
# src:
# 
# - **转换矩阵与精度保真度分析**：
#   - `int` 转 `double`：保真。`int` 具有 31 位精度，`double` 尾数位宽为 53 位，可精确容纳。
#   - `int` 转 `float`：有损。`float` 仅提供 24 位有效精度，超过 $2^{24}$（16,777,216）的整型值将发生舍入。
#   - `float` 转 `double`：精确无损扩展；`double` 转 `float`：面临数值溢出或低位舍入。
#   - 浮点数转整数：统一采用向零截断。
# - **越界未定义行为与底层硬件处理**：
#   - 当浮点数数值超出目标整型表示范围（如 `(int)3e9`）时，ISO C 标准定义其为未定义行为。
#   - x86-64 体系结构下，转换指令对越界或无效浮点数统一输出固定的特殊值：`0x80000000`（即 $-2147483648$）。正向越界反转为负极大值。

