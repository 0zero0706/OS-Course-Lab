text = ''
# src:
# 
# 同学们，前面我们花了两周时间攻克了计算机系统底层的数据表示：补码、溢出、阶码、尾数。
# 大家可能觉得这只是教科书里的枯燥规范。今天这堂课，我们要把视角拉到当今全球计算技术的
# 最前沿——大模型量化。我们将看到，大家刚刚学过的每一个 bit、每一次移位、每一个溢出判定，
# 是如何在真实工业系统里支撑起千亿参数大模型飞速运转的。

['topic-cover-cont.title']
