# src:
# 
# - **加法结合律的失效**：
#   - $(a \oplus b) \oplus c \neq a \oplus (b \oplus c)$。运算顺序改变了中间结果的阶码对齐截断量，破坏了结合律与分配律。
#   - 编译器优化限制：除非显式启用宽松浮点优化编译选项，编译器严禁重排浮点指令执行顺序。
# - **灾难性抵消**：
#   - 当两个相近的浮点数执行减法时，高位有效数字完全抵消，尾部因有限精度产生的舍入误差被提升为主导有效位，导致有效数字位数断崖式下跌。

