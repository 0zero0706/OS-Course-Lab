['float-encoding.notes.1']
src_hash = '51812e49'
text = '''

The all-zeros and all-ones exponent values are reserved, so the usable exponent range of an 8-bit exponent is −126 to 127.
Denormalized values drop the leading 1, which keeps the representable values near zero evenly spaced, so underflow happens gradually.
Denormalized values take $E = -126$ rather than $-127$ so that the largest denormalized value meets the smallest normalized one with no gap between them. The low-precision formats follow the same rules: among the representable values of FP8 E4M3, a substantial share are denormalized.
'''
