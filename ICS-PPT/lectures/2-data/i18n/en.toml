text = ''
# src:
# 
# - **GGUF `scales` 12 字节物理布局协议**：
#   - 前 8 个字节（`scales[0..7]`）：低 6 位分别存放前 4 个步长 $sc_{0..3}$ 与前 4 个偏移 $m_{0..3}$。
#   - 空出的高 2 位（共 $8 \times 2 = 16$ 位）：正好用来存放后 4 个步长与偏移的**高 2 位**！
#   - 后 4 个字节（`scales[8..11]`）：低 4 位与高 4 位分别存放后 4 个步长与偏移的**低 4 位**！
